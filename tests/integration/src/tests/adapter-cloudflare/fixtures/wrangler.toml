name = "adapter-cloudflare-test"
main = "./worker.ts"
compatibility_date = "2025-08-24"
compatibility_flags = [
  "allow_irrevocable_stub_storage", # Persistent stubs (`ctx.restore`) for DO-RPC live updates
  "rpc_params_dup_stubs", # Match current RPC parameter ownership semantics
]

[[durable_objects.bindings]]
name = "SYNC_BACKEND_DO"
class_name = "SyncBackendDO"

[[durable_objects.bindings]]
name = "TEST_STORE_DO"
class_name = "TestStoreDo"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncBackendDO", "TestStoreDo"]
